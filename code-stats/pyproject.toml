[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-stats"
version = "1.0.0"
description = "Command-line tool to count lines of code across programming languages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "code-stats" }]
keywords = ["loc", "cloc", "code-stats", "lines-of-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
codestats = "code_stats.cli:main"

[project.urls]
Homepage = "https://github.com/example/code-stats"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_stats*"]
